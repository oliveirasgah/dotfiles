# Config for the weston compositor that backs SDDM's Wayland greeter.
# - Pin the greeter to the main monitor (DP-1) via its xdg-shell app-id.
#   HDMI-A-1 is left enabled (no mode=off) so it stays powered but black.
# - Give weston a cursor theme/size so the pointer is actually drawn.
# Only affects the greeter; the Hyprland session has its own monitor config.

[shell]
cursor-theme=Bibata-Modern-Ice
cursor-size=24

[output]
name=DP-1
app-ids=sddm-greeter-qt6
